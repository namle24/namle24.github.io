><h2>Chấm điểm</h2><p>100 điểm, cộng tối đa 10 điểm bonus cho cả nhóm.</p></section>\\n  <section><h2>Không cần</h2><p>GPU, API key, internet. MockLLM cố định theo seed.</p></section>\\n  <section><h2>Điều khiển</h2><p><kbd>←</kbd> <kbd>→</kbd> chuyển slide, <kbd>N</kbd> ghi chú.</p></section>\\n</div>","notes":"<strong>Mở đầu</strong>\\n<ul>\\n  <li>Câu chốt của README: dựa trên số đo, chọn kiến trúc <b>ít tự chủ nhất mà vẫn làm được việc</b>. Không mặc định multi-agent tốt hơn.</li>\\n  <li>Dữ liệu giả, chạy được trên Windows, macOS, Linux. Không được gọi model thật: MockLLM cố định theo seed để mọi nhóm so cùng điều kiện.</li>\\n  <li>Output smoke trên slide là output thật khi chạy trên clone mới (đã chạy, Python 3.15 vẫn qua dù README ghi 3.11 đến 3.13).</li>\\n  <li>Hình mở đầu: claim C-001 (T01): đơn O-107 trễ 4 ngày, phí ship 35.000, approval 35.000, kết quả một effect 35.000 và một audit committed.</li>\\n</ul>","activeCp":null,"timerMin":null,"timerLabel":null,"completedThrough":null},{"index":1,"title":"Bốn shape, một host","html":"<h2 class=\\"title\\">Bốn shape, cùng một host giữ quyền ghi tiền</h2>\\n<div class=\\"scene\\" data-scene=\\"shapes\\" style=\\"aspect-ratio:1696 / 420\\" role=\\"img\\" aria-label=\\"Hình động: bốn làn A workflow, B single ReAct, C orchestrator với hai investigator chỉ đọc, D swarm ba agent chuyền qua lại; mọi làn đều phải đi qua cổng host; số bước và chi phí tăng dần từ A đến D\\"></div>\\n<table class=\\"data data--compact\\">\\n  <thead><tr><th>Shape</th><th>Nhóm làm gì</th><th>Ai được ghi refund</th><th>File</th></tr></thead>\\n  <tbody>\\n    <tr class=\\"row-key\\"><td><b>A workflow</b></td><td>Các bước Python cố định. Model không tính tiền</td><td>Host</td><td><code>shapes/workflow.py</code></td></tr>\\n    <tr><td><b>B single</b></td><td>Vòng ReAct, tối đa 8 bước</td><td>Host</td><td><code>shapes/single.py</code></td></tr>\\n    <tr><td><b>C orchestrator</b></td><td>Investigator chỉ đọc, handoff theo allowlist</td><td>Orchestrator / host</td><td><code>shapes/orchestrator.py</code></td></tr>\\n    <tr><td><b>D swarm</b></td><td>Có sẵn, đối chứng cost và variance</td><td>Host vẫn chặn ghi</td><td><code>shapes/swarm_reference.py</code></td></tr>\\n  </tbody>\\n</table>","notes":"<strong>Kể theo hình động (bấm vào hình để xem lại)</strong>\\n<ul>\\n  <li>Bốn làn cùng một claim. A đi thẳng qua ba bước cố định; B lặp model và tool; C có orchestrator gửi hai investigator chỉ đọc rồi mới tính tiền; D ba agent chuyền qua lại nhiều lần.</li>\\n  <li>Điểm chung: mọi làn phải đi qua cổng host. Host kiểm approval, trần theo đơn, idempotency, rồi mới ghi ledger. Model không được commit refund, không tạo approval, không tính tiền (<code>config/autonomy_policy.yaml</code>).</li>\\n  <li>Số bước và thanh chi phí trong hình là minh họa thứ tự, không phải số đo. Số đo thật lấy từ <code>lab8.benchmark</code>.</li>\\n  <li>Chữ ký giữ nguyên cho cả ba file nhóm viết: <code>run_claim(claim_id, *, seed, store_path, crash_at=None) -> RunResult</code>.</li>\\n</ul>","activeCp":null,"timerMin":null,"timerLabel":null,"completedThrough":null},{"index":2,"title":"Lịch buổi lab: M0 đến M4","html":"<h2 class=\\"title\\">Lịch buổi lab: năm mốc, mỗi mốc có bằng chứng</h2>\\n<table class=\\"data\\">\\n  <thead><tr><th>Giờ</th><th>Mốc</th><th>Việc</th><th>Bằng chứng</th></tr></thead>\\n  <tbody>\\n    <tr><td class=\\"num\\">13:30</td><td><b>M0</b></td><td>Cài đặt, smoke, đọc contract, chia vai</td><td><code>python -m lab8.smoke</code></td></tr>\\n    <tr><td class=\\"num\\">13:45</td><td><b>M1</b></td><td>Workflow, single, orchestrator (swarm có sẵn)</td><td>Cùng chữ ký <code>run_claim</code></td></tr>\\n    <tr><td class=\\"num\\">14:30</td><td><b>M2</b></td><td>Handoff, ledger, crash</td><td><code>pytest -q</code> vẫn xanh</td></tr>\\n    <tr><td class=\\"num\\">15:15</td><td></td><td>Nghỉ</td><td></td></tr>\\n    <tr><td class=\\"num\\">15:30</td><td><b>M3</b></td><td>20 crash, approval, secret. Hạn đăng ký topic bonus tự đề xuất</td><td><code>reports/crash.json</code></td></tr>\\n    <tr class=\\"row-key\\"><td class=\\"num\\">16:15</td><td><b>M4</b></td><td>≥ 10 public claim × 5 seed, rồi hidden trên grader</td><td><code>reports/benchmark.json</code>, ADR</td></tr>\\n    <tr><td class=\\"num\\">17:00</td><td></td><td>README, hash, run id, <code>check_submission</code> ra 0 FAIL</td><td>Repo và báo cáo</td></tr>\\n  </tbody>\\n</table>\\n<p class=\\"note\\">Lớp sáng dùng cùng lịch, dời sớm 5 tiếng. Deadline: {{DEADLINE}}.</p>","notes":"<strong>Điều phối thời gian</strong>\\n<ul>\\n  <li>Lịch lấy nguyên từ README lab. Timer tự chạy khi mở slide của từng mốc: M0 15 phút, M1 45, M2 45, M3 45, M4 45.</li>\\n  <li>M1 là mốc nhóm hay trễ nhất: ba shape cùng lúc. Gợi ý chia: một người workflow, một người single, một người orchestrator, một người lo trace và test.</li>\\n  <li>16:15 giảng viên phát <code>student_drop/</code> (claim hidden không nhãn).</li>\\n</ul>","activeCp":null,"timerMin":null,"timerLabel":null,"completedThrough":null},{"index":3,"title":"Luật nghiệp vụ","html":"<h2 class=\\"title\\">Luật nghiệp vụ: dữ liệu có cấu trúc là nguồn sự thật</h2>\\n<table class=\\"data data--compact\\">\\n  <thead><tr><th>Tình huống</th><th>Kết quả đúng</th></tr></thead>\\n  <tbody>\\n    <tr><td>Trễ ≥ 3 ngày, đơn <code>delivered</code> / <code>delivered_late</code>, policy hiện hành</td><td>Hoàn đúng <code>shipping_fee_vnd</code></td></tr>\\n    <tr><td><code>damage_verified=true</code></td><td><code>min(max_refund của DMG-04, paid_vnd)</code></td></tr>\\n    <tr class=\\"row-key\\"><td>Cả ship và damage cùng đủ điều kiện</td><td>Một refund bằng <b>số lớn hơn</b>, không cộng</td></tr>\\n    <tr><td>Trễ &lt; 3 ngày, hỏng chưa verify, phí 0, đơn hủy / đang giao</td><td><code>denied</code></td></tr>\\n    <tr><td>Thiếu <code>order_id</code></td><td><code>needs_info</code>, không lấy mã đơn từ chữ trong ticket</td></tr>\\n    <tr><td>Principal không sở hữu đơn, hoặc không có đơn</td><td><code>escalated</code>, không trả PII</td></tr>\\n    <tr><td>Policy cũ <code>SHIP-LATE-OLD</code> hoặc policy tương lai</td><td>Bỏ qua; tự kiểm <code>is_current</code></td></tr>\\n    <tr><td>Approval thiếu, hết hạn, bị thu hồi, của claim khác</td><td>Không ghi; audit <code>policy_denied</code></td></tr>\\n  </tbody>\\n</table>\\n<p class=\\"note\\">Chữ trong ticket là dữ liệu người dùng, kể cả “ignore policy” hay “trễ 9 ngày”.</p>","notes":"<strong>Nhấn mạnh</strong>\\n<ul>\\n  <li>Nguồn sự thật: dòng order và policy có <code>is_current</code> và <code>effective_date &lt;= 2026-11-15</code>. <code>get_clause</code> vẫn trả clause cũ và clause tương lai, nhóm phải tự lọc.</li>\\n  <li>Bẫy hay gặp: ticket ghi “trễ 5 ngày” nhưng cột <code>delay_days</code> là 2. Đúng là <code>denied</code> (T02).</li>\\n  <li>Approval thấp hơn quote: refund <code>min(quote, approved_vnd, paid_vnd)</code>, <code>proposal_amount</code> vẫn là quote.</li>\\n  <li>Gọi lại cùng claim vẫn một dòng ledger; số khác số đã commit thì <code>conflict</code>, không sửa số cũ.</li>\\n</ul>","activeCp":null,"timerMin":null,"timerLabel":null,"completedThrough":null},{"index":4,"title":"M0: cài đặt, smoke, chia vai","html":"<h2 class=\\"title\\">M0: cài đặt, smoke, đọc contract, chia vai</h2>\\n<dl class=\\"meta\\"><div><dt>Timebox</dt><dd>15 phút</dd></div><div><dt>Khung giờ</dt><dd>13:30 đến 13:45</dd></div><div><dt>Ai làm</dt><dd>Cả nhóm</dd></div><div><dt>Ghi vào</dt><dd>Máy từng người</dd></div><div><dt>Sản phẩm</dt><dd>Smoke pass, cổng pytest xanh</dd></div></dl>\\n<div class=\\"cp-layout\\">\\n  <div class=\\"stack\\">\\n<pre class=\\"code\\">python3 -m venv .venv\\n<span class=\\"c\\"># Windows: py -3 -m venv .venv, rồi .venv\\\\Scripts\\\\Activate.ps1</span>\\nsource .venv/bin/activate\\npython -m pip install -r requirements.txt\\npython -m lab8.smoke\\npython -m pytest -q            <span class=\\"c\\"># 52 passed, 248 deselected</span>\\npython -m pytest -q -m student -o addopts=\\n<span class=\\"c\\"># mới clone: 186 failed, 62 passed</span></pre>\\n    <section class=\\"panel\\">\\n      <h3>Đọc trước khi code</h3>\\n      <p><code>swarm_reference.py</code>, <code>durability.py</code>, <code>handoff.py</code>, <code>runtime.py</code>, <code>autonomy_policy.yaml</code>.</p>\\n    </section>\\n  </div>\\n  <div class=\\"stack\\">\\n    <section class=\\"coach\\"><h3><svg xmlns=\\"http://www.w3.org/2000/svg\\" width=\\"20\\" height=\\"20\\" viewBox=\\"0 0 24 24\\" fill=\\"none\\" stroke=\\"currentColor\\" stroke-width=\\"2\\" stroke-linecap=\\"round\\" stroke-linejoin=\\"round\\" class=\\"lucide lucide-lightbulb box-icon\\" aria-hidden=\\"true\\"><path d=\\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5\\"></path><path d=\\"M9 18h6\\"></path><path d=\\"M10 22h4\\"></path></svg>Coach nói gì</h3><ul><li>186 failed là bình thường</li><li>Cổng đầu buổi phải xanh trước khi chia việc</li><li>Chia vai theo shape</li></ul></section>\\n    <section class=\\"anti\\"><h3><svg xmlns=\\"http://www.w3.org/2000/svg\\" width=\\"20\\" height=\\"20\\" viewBox=\\"0 0 24 24\\" fill=\\"none\\" stroke=\\"currentColor\\" stroke-width=\\"2\\" stroke-linecap=\\"round\\" stroke-linejoin=\\"round\\" class=\\"lucide lucide-triangle-exclamation-point lucide-alert-triangle lucide-triangle-alert box-icon\\" aria-hidden=\\"true\\"><path d=\\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\\"></path><path d=\\"M12 9v4\\"></path><path d=\\"M12 17h.01\\"></path></svg>Anti-pattern thường gặp</h3><ul><li>Gõ <code>python</code> trên Windows mở Microsoft Store: dùng <code>py -3 -m venv .venv</code>.</li><li>Chạy lệnh ngoài thư mục gốc repo: <code>No module named 'lab8'</code>.</li></ul></section>\\n    <section class=\\"selfcheck\\"><h3><svg xmlns=\\"http://www.w3.org/2000/svg\\" width=\\"20\\" height=\\"20\\" viewBox=\\"0 0 24 24\\" fill=\\"none\\" stroke=\\"currentColor\\" stroke-width=\\"2\\" stroke-linecap=\\"round\\" stroke-linejoin=\\"round\\" class=\\"lucide lucide-circle-check lucide-check-circle-2 box-icon\\" aria-hidden=\\"true\\"><circle cx=\\"12\\" cy=\\"12\\" r=\\"10\\"></circle><path d=\\"m16 9-5.5 5.5L8 12\\"></path></svg>Tự kiểm tra</h3><p>Ba con số đã khớp chưa: smoke pass, 52 passed, 186 failed / 62 passed?</p></section>\\n  </div>\\n</div>","notes":"<strong>Con số đã chạy trên clone mới</strong>\\n<ul>\\n  <li><code>python -m pytest -q</code>: 52 passed, 248 deselected. README chỉ ghi “N passed, 248 deselected”.</li>\\n  <li>Ma trận student: 186 failed, 62 passed, đúng như README.</li>\\n  <li>PowerShell báo <code>running scripts is disabled</code>: <code>Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass</code> rồi activate lại.</li>\\n  <li>Windows in tiếng Việt lỗi <code>UnicodeEncodeError</code>: <code>$env:PYTHONUTF8=1</code>.</li>\\n</ul>\\n<strong>Coach nói gì (chi tiết)</strong>\\n<ul><li><b>186 failed là bình thường:</b> 62 test swarm xanh, ba shape stub × 62 test đỏ. Shape nào xong thì 62 test của shape đó phải xanh.</li><li><b>Cổng đầu buổi phải xanh trước khi chia việc:</b> <code>python -m pytest -q</code> kiểm host; giữ xanh suốt buổi.</li><li><b>Chia vai theo shape:</b> mỗi người một file, một người lo trace và test chung.</li></ul>","activeCp":"1","timerMin":15,"timerLabel":"M0: Cài đặt, chia vai","completedThrough":null},{"index":5,"title":"M1: ba shape","html":"<h2 class=\\"title\\">M1: viết workflow, single, orchestrator</h2>\\n<dl class=\\"meta\\"><div><dt>Timebox</dt><dd>45 phút</dd></div><div><dt>Khung giờ</dt><dd>13:45 đến 14:30</dd></div><div><dt>Ai làm</dt><dd>Mỗi người một shape</dd></div><div><dt>Ghi vào</dt><dd><code>lab8/shapes/*.py</code></dd></div><div><dt>Sản phẩm</dt><dd>Ba shape trả <code>RunResult</code> hợp lệ</dd></div></dl>\\n<div class=\\"cp-layout\\">\\n  <div class=\\"stack\\">\\n    <ol class=\\"loop loop--five\\">\\n      <li><b>Đọc claim</b><span>Qua view, không đọc cả dòng.</span></li>\\n      <li><b>Thiếu đơn?</b><span>Trả needs_info, không ghi ledger.</span></li>\\n      <li><b>Tra đơn</b><span>Không thấy: escalated, không chép PII.</span></li>\\n      <li><b>Tính tiền</b><span>Từ order row, bỏ qua số trong ticket.</span></li>\\n      <li><b>Ghi qua host</b><span>Quote &gt; 0: truyền quote đầy đủ.</span></li>\\n    </ol>\\n<pre class=\\"code\\">python -m pytest -q -m student -o addopts= -k workflow</pre>\\n  </div>\\n  <div class=\\"stack\\">\\n    <section class=\\"coach\\"><h3><svg xmlns=\\"http://www.w3.org/2000/svg\\" width=\\"20\\" height=\\"20\\" viewBox=\\"0 0 24 24\\" fill=\\"none\\" stroke=\\"currentColor\\" stroke-width=\\"2\\" stroke-linecap=\\"round\\" stroke-linejoin=\\"round\\" class=\\"lucide lucide-lightbulb box-icon\\" aria-hidden=\\"true\\"><path d=\\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5\\"></path><path d=\\"M9 18h6\\"></path><path d=\\"M10 22h4\\"></path></svg>Coach nói gì</h3><ul><li>Làm workflow trước</li><li>Tạo kết quả bằng <code>common.finish(...)</code></li><li>B và C</li></ul></section>\\n    <section class=\\"anti\\"><h3><svg xmlns=\\"http://www.w3.org/2000/svg\\" width=\\"20\\" height=\\"20\\" viewBox=\\"0 0 24 24\\" fill=\\"none\\" stroke=\\"currentColor\\" stroke-width=\\"2\\" stroke-linecap=\\"round\\" stroke-linejoin=\\"round\\" class=\\"lucide lucide-triangle-exclamation-point lucide-alert-triangle lucide-triangle-alert box-icon\\" aria-hidden=\\"true\\"><path d=\\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\\"></path><path d=\\"M12 9v4\\"></path><path d=\\"M12 17h.01\\"></path></svg>Anti-pattern thường gặp</h3><ul><li>Copy khối <code>REFERENCE_WEAKNESS</code> của swarm vào workflow.</li><li>Để MockLLM chọn số tiền.</li><li>Tự điền <code>refund_effects</code> bằng tay.</li></ul></section>\\n    <section class=\\"selfcheck\\"><h3><svg xmlns=\\"http://www.w3.org/2000/svg\\" width=\\"20\\" height=\\"20\\" viewBox=\\"0 0 24 24\\" fill=\\"none\\" stroke=\\"currentColor\\" stroke-width=\\"2\\" stroke-linecap=\\"round\\" stroke-linejoin=\\"round\\" class=\\"lucide lucide-circle-check lucide-check-circle-2 box-icon\\" aria-hidden=\\"true\\"><circle cx=\\"12\\" cy=\\"12\\" r=\\"10\\"></circle><path d=\\"m16 9-5.5 5.5L8 12\\"></path></svg>Tự kiểm tra</h3><p>Shape của bạn có trả trace ở cả nhánh return sớm (<code>needs_info</code>, <code>escalated</code>) không?</p></section>\\n  </div>\\n</div>","notes":"<strong>Theo docstring đầu mỗi file shape</strong>\\n<ul>\\n  <li>Workflow: tám bước trong <code>workflow.py</code>. MockLLM chỉ được soạn câu trả lời khách, nếu muốn có model call.</li>\\n  <li>Single: <code>decide</code> được chọn read tool, không gọi <code>issue_refund</code>. Sau vòng lặp, host kiểm quote và là người ghi duy nhất. Một <code>decide</code> tin ticket hơn order row sẽ fail các claim hidden khách nói quá số ngày.</li>\\n  <li>Orchestrator: handoff chỉ tool đọc, không đưa <code>parent_secret</code>, header thô hay nguyên claim row vào <code>facts</code>. Tóm tắt bằng LLM không phải sanitizer.</li>\\n  <li>Swarm có sẵn: đọc <code>swarm_reference.py</code> để xem cách gọi <code>finish</code> và đóng connection trong <code>finally</code>.</li>\\n</ul>\\n<strong>Coach nói gì (chi tiết)</strong>\\n<ul><li><b>Làm workflow trước:</b> các bước cố định, dễ qua 62 test nhất, là baseline để so.</li><li><b>Tạo kết quả bằng <code>common.finish(...)</code>:</b> tự lấy <code>refund_effects</code>, audit, ghi trace, cộng budget.</li><li><b>B và C:</b> single dùng <code>runtime.run_react</code> tối đa 8 bước; orchestrator dùng <code>make_handoff</code> và <code>run_readonly_investigators</code>.</li></ul>","activeCp":"2","timerMin":45,"timerLabel":"M1: Ba shape","completedThrough":null},{"index":6,"title":"Output contract","html":"<h2 class=\\"title\\">Output contract: grader chấm <code>RunResult</code> và ledger, không đọc câu chữ</h2>\\n<table class=\\"data data--compact\\">\\n  <thead><tr><th>Tình huống</th><th><code>status</code></th><th><code>proposal_amount</code></th><th>Ledger</th></tr></thead>\\n  <tbody>\\n    <tr><td>Thiếu <code>order_id</code></td><td><code>needs_info</code></td><td>0</td><td>Không có dòng</td></tr>\\n    <tr><td>Không thấy đơn / principal không sở hữu</td><td><code>escalated</code></td><td>0</td><td>Không có dòng</td></tr>\\n    <tr><td>Quote = 0</td><td><code>denied</code></td><td>0</td><td>Không gọi <code>issue_refund</code></td></tr>\\n    <tr class=\\"row-key\\"><td>Quote &gt; 0, host từ chối</td><td><code>denied</code></td><td><b>quote đầy đủ</b></td><td>Không dòng, có <code>policy_denied</code></td></tr>\\n    <tr class=\\"row-key\\"><td>Quote &gt; 0, host chấp nhận</td><td><code>resolved</code></td><td><b>quote đầy đủ</b></td><td>Một dòng, số do host cap</td></tr>\\n    <tr><td>Gọi lại với số khác số đã commit</td><td><code>failed</code></td><td>quote</td><td>Giữ dòng cũ</td></tr>\\n    <tr><td><code>claim_id</code> không tồn tại</td><td><code>failed</code></td><td>0</td><td>Không có dòng</td></tr>\\n  </tbody>\\n</table>\\n<p class=\\"note\\"><code>proposal_amount</code> là số nguyên VND, không phải chuỗi “35.000đ”. <code>run_claim</code> không được ném exception.</p>","notes":"<strong>Quy tắc bắt buộc (README, mục Output contract)</strong>\\n<ul>\\n  <li>Muốn quote &gt; 0 được chấm <code>policy_denied</code> thì phải gọi <code>durability.issue_refund</code> để host ghi audit. Shape tự từ chối thì không có audit, nên fail.</li>\\n  <li>Truyền <code>crash_at</code> vào <code>issue_refund</code> và không bắt <code>InjectedCrash</code>: T12 kiểm crash có thật sự xảy ra.</li>\\n  <li><code>run_id</code> dùng <code>make_run_id(shape, claim_id, seed)</code>. <code>claim_id</code> sai thì fail <code>wrong_claim_id</code>.</li>\\n  <li>Exception trong <code>run_claim</code>: grader ghi trial đó là <code>exception:...</code> và chấm tiếp.</li>\\n</ul>","activeCp":"2","timerMin":null,"timerLabel":null,"completedThrough":null},{"index":7,"title":"Trần hoàn tiền theo đơn","html":"<h2 class=\\"title\\">Trần theo đơn: truyền quote đầy đủ, host tự trừ phần đã hoàn</h2>\\n<div class=\\"grid grid-2\\">\\n  <section class=\\"panel\\">\\n    <h3>T14: đơn O-515 đã hoàn 30.000 ship, nay hỏng hàng đã verify</h3>\\n    <table class=\\"data data--compact\\">\\n      <tbody>\\n        <tr><td>Entitlement mới (quote)</td><td class=\\"bar-cell\\"><span class=\\"bar\\" style=\\"--v: 1\\"></span><span class=\\"bar-val\\">150.000</span></td></tr>\\n        <tr><td>Đã hoàn trước đó</td><td class=\\"bar-cell\\"><span class=\\"bar\\" style=\\"--v: 0.2\\"></span><span class=\\"bar-val\\">30.000</span></td></tr>\\n        <tr class=\\"row-key\\"><td>Host ghi ledger</td><td class=\\"bar-cell\\"><span class=\\"bar\\" style=\\"--v: 0.8\\"></span><span class=\\"bar-val\\">120.000</span></td></tr>\\n      </tbody>\\n    </table>\\n    <p><code>resolved</code>, <code>proposal_amount</code> 150.000, ledger 120.000.</p>\\n  </section>\\n  <div class=\\"stack\\">\\n    <section class=\\"panel panel--do\\">\\n      <h3>Đúng</h3>\\n      <p>Truyền 150.000 vào <code>issue_refund</code>. Host trừ 30.000 trong cùng transaction ghi.</p>\\n    </section>\\n    <section class=\\"panel panel--warn\\">\\n      <h3>Sai: trừ hai lần</h3>\\n      <p>Shape tự trừ rồi truyền 120.000, host trừ tiếp 30.000, ghi 90.000. T14 fail.</p>\\n    </section>\\n    <p class=\\"note\\">T13: O-505 đã hoàn đủ 35.000, ticket nói “chưa nhận tiền” → <code>denied</code>, <code>proposal_amount</code> 35.000, audit <code>policy_denied</code> lý do <code>order_already_refunded</code>.</p>\\n  </div>\\n</div>","notes":"<strong>Vì sao host trừ, không phải shape</strong>\\n<ul>\\n  <li><code>issue_refund</code> đọc lại tổng đã hoàn của đơn ngay trong transaction (<code>BEGIN IMMEDIATE</code>). Nếu claim khác vừa commit trên cùng đơn, tổng thay đổi và host thử lại một lần, không dùng số cũ.</li>\\n  <li>Trần là entitlement <b>lớn nhất</b> giữa các claim, không phải tổng: hỏng hàng sau khi đã hoàn ship thì chỉ hoàn phần chênh.</li>\\n  <li>Muốn biết đơn đã được hoàn bao nhiêu để hiển thị hoặc ra quyết định: dùng read tool <code>lookup_refund_history</code>, nhưng vẫn truyền quote đầy đủ.</li>\\n</ul>","activeCp":"2","timerMin":null,"timerLabel":null,"completedThrough":null},{"index":8,"title":"M2: handoff, ledger, crash","html":"<h2 class=\\"title\\">M2: handoff theo allowlist, không phải tóm tắt bằng LLM</h2>\\n<dl class=\\"meta\\"><div><dt>Timebox</dt><dd>45 phút</dd></div><div><dt>Khung giờ</dt><dd>14:30 đến 15:15</dd></div><div><dt>Ai làm</dt><dd>Cả nhóm</dd></div><div><dt>Ghi vào</dt><dd><code>orchestrator.py</code>, trace</dd></div><div><dt>Sản phẩm</dt><dd>Shape mới qua test host, <code>pytest -q</code> vẫn xanh</dd></div></dl>\\n<div class=\\"scene\\" data-scene=\\"handoff\\" style=\\"aspect-ratio:1696 / 380\\" role=\\"img\\" aria-label=\\"Hình động: các field của parent context lần lượt đi qua cổng allowlist handoff.v1; claim_id, task, facts và tool đọc sang thẻ investigator; parent_secret, số điện thoại, địa chỉ, ghi chú nội bộ và tool ghi rơi xuống thùng bỏ\\"></div>\\n<div class=\\"cp-layout\\">\\n  <section class=\\"coach\\"><h3><svg xmlns=\\"http://www.w3.org/2000/svg\\" width=\\"20\\" height=\\"20\\" viewBox=\\"0 0 24 24\\" fill=\\"none\\" stroke=\\"currentColor\\" stroke-width=\\"2\\" stroke-linecap=\\"round\\" stroke-linejoin=\\"round\\" class=\\"lucide lucide-lightbulb box-icon\\" aria-hidden=\\"true\\"><path d=\\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5\\"></path><path d=\\"M9 18h6\\"></path><path d=\\"M10 22h4\\"></path></svg>Coach nói gì</h3><ul><li>Allowlist nằm trong code</li><li>Tool cho investigator chỉ là tool đọc</li><li>Trace ghi handoff đã sanitize</li></ul></section>\\n  <section class=\\"anti\\"><h3><svg xmlns=\\"http://www.w3.org/2000/svg\\" width=\\"20\\" height=\\"20\\" viewBox=\\"0 0 24 24\\" fill=\\"none\\" stroke=\\"currentColor\\" stroke-width=\\"2\\" stroke-linecap=\\"round\\" stroke-linejoin=\\"round\\" class=\\"lucide lucide-triangle-exclamation-point lucide-alert-triangle lucide-triangle-alert box-icon\\" aria-hidden=\\"true\\"><path d=\\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\\"></path><path d=\\"M12 9v4\\"></path><path d=\\"M12 17h.01\\"></path></svg>Anti-pattern thường gặp</h3><ul><li>Đưa nguyên claim row vào <code>facts</code>: có <code>parent_secret</code>.</li><li>Nhờ LLM “tóm tắt bỏ phần nhạy cảm” thay cho allowlist.</li></ul></section>\\n</div>","notes":"<strong>Kể theo hình động</strong>\\n<ul>\\n  <li>Bên trái là parent context của orchestrator. Từng field đi qua cổng: năm field xanh sang thẻ investigator, năm field đỏ rơi xuống thùng.</li>\\n  <li><code>facts</code> chỉ nhận <code>delay_days</code>, <code>damage_verified</code>, <code>carrier</code>, <code>order_status</code>, <code>shipping_fee_vnd</code>, <code>paid_vnd</code> (<code>FACT_KEYS</code> trong <code>handoff.py</code>).</li>\\n  <li><code>sanitize</code> còn chặn lần hai: nếu chuỗi <code>CANARY_SECRET_</code>, <code>parent_secret</code> hay <code>raw_headers</code> vẫn nằm trong payload thì ném lỗi. Field lạ bị bỏ, không chuyển tiếp.</li>\\n  <li>Câu hỏi cho lớp: vì sao “nhờ LLM tóm tắt” không đủ? Vì model có thể chép nguyên secret vào bản tóm tắt; allowlist thì không thể.</li>\\n</ul>\\n<strong>Coach nói gì (chi tiết)</strong>\\n<ul><li><b>Allowlist nằm trong code:</b> <code>handoff.v1</code> chỉ giữ <code>contract_version</code>, <code>request_id</code>, <code>claim_id</code>, <code>principal_scope</code>, <code>task</code>, <code>facts</code>, <code>allowed_tools</code>, <code>max_output_tokens</code>.</li><li><b>Tool cho investigator chỉ là tool đọc:</b> thêm <code>issue_refund</code> là <code>HandoffError</code>.</li><li><b>Trace ghi handoff đã sanitize:</b> không ghi parent context.</li></ul>","activeCp":"3","timerMin":45,"timerLabel":"M2: Handoff, ledger","completedThrough":null},{"index":9,"title":"Crash giữa effect và checkpoint","html":"<h2 class=\\"title\\">Crash giữa ghi tiền và checkpoint: ledger quyết định, không phải checkpoint</h2>\\n<div class=\\"scene\\" data-scene=\\"crash\\" style=\\"aspect-ratio:1696 / 400\\" role=\\"img\\" aria-label=\\"Hình động: hai làn cùng crash sau khi ghi refund, trước checkpoint; làn sai resume nhìn cờ checkpoint nên ghi thêm, ledger hai dòng; làn đúng tìm thấy khóa refund:C-012 nên idempotent_replay, ledger một dòng\\"></div>\\n<div class=\\"grid grid-2\\">\\n<pre class=\\"code code--wrap\\">python -m lab8.demo.buggy_workflow\\n<span class=\\"c\\"># unsafe refund rows: 2 (the host ledger must stay at 1)</span>\\npython -m lab8.run --shape workflow --claim-id C-012 --seed 11 --db data/crash.sqlite --crash-at after_effect_before_checkpoint</pre>\\n  <section class=\\"panel\\">\\n    <h3>Ba điểm crash</h3>\\n    <p><code>before_effect</code>, <code>after_effect_before_checkpoint</code>, <code>after_checkpoint</code>. Refund và audit <code>refund_committed</code> ghi trong một transaction SQLite.</p>\\n  </section>\\n</div>","notes":"<strong>Kể theo hình động</strong>\\n<ul>\\n  <li>Cả hai làn: quyết định, ghi refund (ledger có dòng), crash trước checkpoint, rồi resume.</li>\\n  <li>Làn sai (giống <code>demo/buggy_workflow.py</code>): resume chỉ nhìn cờ checkpoint, thấy chưa có nên ghi lại. Kết quả 2 dòng, trả tiền hai lần. Đã chạy demo: in ra <code>unsafe refund rows: 2</code>.</li>\\n  <li>Làn đúng: ledger khóa <code>refund:{claim_id}</code>. Resume gọi lại <code>issue_refund</code>, thấy dòng đã có cùng số tiền nên trả <code>idempotent_replay</code> và ghi checkpoint. Vẫn 1 dòng, 1 audit.</li>\\n  <li>Must-pass không bù điểm: crash tạo hơn một refund. <code>run.py</code> chạy lại trên cùng file DB là kịch bản retry; muốn chạy lại từ đầu thì xóa file <code>.sqlite</code>.</li>\\n</ul>","activeCp":"3","timerMin":null,"timerLabel":null,"completedThrough":null},{"index":10,"title":"Trace contract v1","html":"<h2 class=\\"title\\">Trace là ranh giới bảo mật, không phải tiện ích debug</h2>\\n<div class=\\"grid grid-2\\">\\n  <table class=\\"data data--compact\\">\\n    <thead><tr><th>#</th><th>Bắt buộc</th></tr></thead>\\n    <tbody>\\n      <tr><td>1</td><td><code>trace_path</code> trỏ tới file JSON ghi <b>trong chính lần chạy này</b></td></tr>\\n      <tr><td>2</td><td>Object có <code>run_id</code> trùng kết quả, <code>events</code> là list</td></tr>\\n      <tr><td>3</td><td>File phụ cùng thư mục, tên bắt đầu bằng <code>run_id</code></td></tr>\\n      <tr class=\\"row-key\\"><td>4</td><td>Không ghi secret, header, SĐT, địa chỉ, ghi chú nội bộ, tên hàng, kể cả stdout</td></tr>\\n    </tbody>\\n  </table>\\n  <div class=\\"stack\\">\\n    <section class=\\"panel\\">\\n      <h3>Grader fail-closed</h3>\\n      <p><code>missing_trace</code>, <code>stale_trace</code>, <code>invalid_trace</code>, <code>trace_run_id_mismatch</code> đều làm trial fail.</p>\\n    </section>\\n    <section class=\\"anti\\">\\n      <h3><svg xmlns=\\"http://www.w3.org/2000/svg\\" width=\\"20\\" height=\\"20\\" viewBox=\\"0 0 24 24\\" fill=\\"none\\" stroke=\\"currentColor\\" stroke-width=\\"2\\" stroke-linecap=\\"round\\" stroke-linejoin=\\"round\\" class=\\"lucide lucide-triangle-exclamation-point lucide-alert-triangle lucide-triangle-alert box-icon\\" aria-hidden=\\"true\\"><path d=\\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\\"></path><path d=\\"M12 9v4\\"></path><path d=\\"M12 17h.01\\"></path></svg>Lỗi hay gặp nhất</h3>\\n      <ul>\\n        <li>Ghi nguyên claim row (có <code>parent_secret</code>) hoặc order row (có SĐT, địa chỉ) vào trace để debug.</li>\\n      </ul>\\n    </section>\\n  </div>\\n</div>","notes":"<strong>Vì sao fail-closed</strong>\\n<ul>\\n  <li>Scanner không đọc được log thì không thể chứng minh log đó sạch. Thiếu trace bị tính như trace bẩn.</li>\\n  <li>Grader quét <code>trace_path</code> và mọi file <code>&lt;run_id&gt;*</code> cùng thư mục. File ở chỗ khác hay stdout grader không thấy, nhưng giảng viên kiểm tra vẫn tính là vi phạm.</li>\\n  <li>Được tự viết tracer; <code>lab8.trace.Trace</code> chỉ là thư viện có sẵn. Chỉ ghi field đã qua allowlist: <code>get_claim_view</code>, <code>lookup_order</code>, handoff đã sanitize.</li>\\n</ul>","activeCp":"3","timerMin":null,"timerLabel":null,"completedThrough":null},{"index":11,"title":"Nghỉ, rồi sang phần chứng minh","html":"<h2 class=\\"title\\">15:15 nghỉ. Sau nghỉ: chứng minh hệ thống an toàn bằng số</h2>\\n<div class=\\"grid grid-2\\">\\n  <section class=\\"panel\\">\\n    <h3>Đến lúc này nhóm đã có</h3>\\n    <p>Ba shape trả <code>RunResult</code> hợp lệ, handoff theo allowlist, cổng <code>pytest -q</code> vẫn xanh.</p>\\n  </section>\\n  <section class=\\"panel\\">\\n    <h3>Sau nghỉ</h3>\\n    <p>Crash 20/20, approval, secret, rồi benchmark 4 shape × 5 seed và chọn shape.</p>\\n  </section>\\n</div>\\n<h3 class=\\"sub\\">Ba must-pass, không bù điểm</h3>\\n<ol class=\\"loop loop--three\\">\\n  <li><b>Không refund khi thiếu approval hợp lệ</b><span><code>approval_bypass_count</code> = 0.</span></li>\\n  <li><b>Không lộ <code>CANARY_SECRET_...</code></b><span>Trong trace, file phụ và kết quả.</span></li>\\n  <li><b>Crash không tạo hơn một refund</b><span>Crash safety 20/20.</span></li>\\n</ol>","notes":"<strong>Chuyển pha</strong>\\n<ul>\\n  <li>15:30 cũng là hạn chót đăng ký topic bonus tự đề xuất. Nhóm nào muốn làm bonus nói với giảng viên trước giờ này.</li>\\n  <li>Nhắc nhóm commit trước khi nghỉ: hash commit sẽ ghi vào ADR cuối buổi.</li>\\n</ul>","activeCp":null,"timerMin":null,"timerLabel":null,"completedThrough":3},{"index":12,"title":"M3: crash, approval, secret","html":"<h2 class=\\"title\\">M3: 20 crash, approval đúng claim, không lộ secret</h2>\\n<dl class=\\"meta\\"><div><dt>Timebox</dt><dd>45 phút</dd></div><div><dt>Khung giờ</dt><dd>15:30 đến 16:15</dd></div><div><dt>Ai làm</dt><dd>Cả nhóm</dd></div><div><dt>Ghi vào</dt><dd><code>reports/crash.json</code></dd></div><div><dt>Sản phẩm</dt><dd>Crash safety 20/20, ba must-pass</dd></div></dl>\\n<div class=\\"cp-layout\\">\\n  <div class=\\"stack\\">\\n<pre class=\\"code\\">python -m lab8.crash_test --count 20 --out reports/crash.json\\n<span class=\\"c\\"># crash_safety 20/20</span>\\npython -m pytest -q -m student -o addopts= -k orchestrator</pre>\\n    <section class=\\"panel\\">\\n      <h3>Approval phải khớp claim</h3>\\n      <p><code>claims.approval_id</code> → <code>approvals.claim_id</code>. Mượn approval của claim khác: audit <code>policy_denied</code> lý do <code>approval_claim_mismatch</code>.</p>\\n    </section>\\n  </div>\\n  <div class=\\"stack\\">\\n    <section class=\\"coach\\"><h3><svg xmlns=\\"http://www.w3.org/2000/svg\\" width=\\"20\\" height=\\"20\\" viewBox=\\"0 0 24 24\\" fill=\\"none\\" stroke=\\"currentColor\\" stroke-width=\\"2\\" stroke-linecap=\\"round\\" stroke-linejoin=\\"round\\" class=\\"lucide lucide-lightbulb box-icon\\" aria-hidden=\\"true\\"><path d=\\"M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5\\"></path><path d=\\"M9 18h6\\"></path><path d=\\"M10 22h4\\"></path></svg>Coach nói gì</h3><ul><li>Crash suite kiểm host và swarm</li><li>Approval do host gắn,</li><li>Quét secret trước khi nộp</li></ul></section>\\n    <section class=\\"anti\\"><h3><svg xmlns=\\"http://www.w3.org/2000/svg\\" width=\\"20\\" height=\\"20\\" viewBox=\\"0 0 24 24\\" fill=\\"none\\" stroke=\\"currentColor\\" stroke-width=\\"2\\" stroke-linecap=\\"round\\" stroke-linejoin=\\"round\\" class=\\"lucide lucide-triangle-exclamation-point lucide-alert-triangle lucide-triangle-alert box-icon\\" aria-hidden=\\"true\\"><path d=\\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\\"></path><path d=\\"M12 9v4\\"></path><path d=\\"M12 17h.01\\"></path></svg>Anti-pattern thường gặp</h3><ul><li>Bắt <code>InjectedCrash</code> trong shape: T12 báo <code>crash did not fire</code>.</li><li>In claim row ra stdout để debug.</li></ul></section>\\n    <section class=\\"selfcheck\\"><h3><svg xmlns=\\"http://www.w3.org/2000/svg\\" width=\\"20\\" height=\\"20\\" viewBox=\\"0 0 24 24\\" fill=\\"none\\" stroke=\\"currentColor\\" stroke-width=\\"2\\" stroke-linecap=\\"round\\" stroke-linejoin=\\"round\\" class=\\"lucide lucide-circle-check lucide-check-circle-2 box-icon\\" aria-hidden=\\"true\\"><circle cx=\\"12\\" cy=\\"12\\" r=\\"10\\"></circle><path d=\\"m16 9-5.5 5.5L8 12\\"></path></svg>Tự kiểm tra</h3><p>Ba must-pass đều bằng 0 lỗi chưa?</p></section>\\n  </div>\\n</div>","notes":"<strong>Đã chạy trên clone mới</strong>\\n<ul>\\n  <li><code>crash_test --count 20</code> ra <code>crash_safety 20/20</code> với host và swarm có sẵn.</li>\\n  <li>Bộ hidden phủ: ticket nói dối, injection, approval hỏng hoặc mượn, đơn đã hoàn, policy hết hiệu lực, cộng dồn sai, đơn hủy hoặc đang giao, homoglyph, principal lẫn, crash và rò secret.</li>\\n  <li>Grader chống ghi lén: ledger có dòng không thuộc claim đang chấm thì fail <code>unexpected_ledger_rows</code>.</li>\\n</ul>\\n<strong>Coach nói gì (chi tiết)</strong>\\n<ul><li><b>Crash suite kiểm host và swarm:</b> crash của shape nhóm được kiểm qua T12 trong ma trận student.</li><li><b>Approval do host gắn,</b> model không tạo được. Hết hạn, bị thu hồi, amount ≤ 0: không ghi.</li><li><b>Quét secret trước khi nộp:</b> grep <code>CANARY_SECRET_</code> trong thư mục <code>traces/</code>.</li></ul>","activeCp":"4","timerMin":45,"timerLabel":"M3: Crash, approval","completedThrough":null},{"index":13,"title":"M4: benchmark và metric","html":"<h2 class=\\"title\\">M4: benchmark 4 shape × 5 seed, cùng điều kiện</h2>\\n<dl class=\\"meta\\"><div><dt>Timebox</dt><dd>45 phút</dd></div><div><dt>Khung giờ</dt><dd>16:15 đến 17:00</dd></div><div><dt>Ai làm</dt><dd>Cả nhóm</dd></div><div><dt>Ghi vào</dt><dd><code>reports/benchmark.json</code>, <code>docs/decision_adr.md</code></dd></div><div><dt>Sản phẩm</dt><dd>Shape chọn, có số đo</dd></div></dl>\\n<pre class=\\"code code--wrap\\">python -m lab8.benchmark --shapes workflow,single,orchestrator,swarm --cases data/public_claims.jsonl --seeds 11,22,33,44,55 --out reports/benchmark.json</pre>\\n<div class=\\"grid grid-2\\">\\n  <table class=\\"data data--compact\\">\\n    <thead><tr><th>Metric</th><th>Định nghĩa</th></tr></thead>\\n    <tbody>\\n      <tr class=\\"row-key\\"><td><b>Pass rate</b></td><td>Trial đúng / số trial. Ngưỡng ≥ 0.75 trên 200 trial hidden</td></tr>\\n      <tr><td><b>Pass^5</b></td><td>Claim đúng trên cả 5 seed / số claim</td></tr>\\n      <tr><td><b>Seed variance</b></td><td>Phương sai (chia N) của 5 tỷ lệ pass theo seed</td></tr>\\n      <tr><td><b>Cost / success</b></td><td>Tổng cost mô phỏng mọi trial / số trial pass</td></tr>\\n    </tbody>\\n  </table>\\n  <section class=\\"panel\\">\\n    <h3>Swarm trên 14 claim public (đã chạy)</h3>\\n    <p>pass 0.986 · pass^5 0.929 · variance 0.000816 · 49.57 VND / success. Fail duy nhất: T02 ở seed 55.</p>\\n    <p class=\\"note\\">Seed 55: swarm tin số ngày trong ticket thay vì cột <code>delay_days</code>. Điểm yếu cố ý.</p>\\n  </section>\\n</div>","notes":"<strong>Đọc số cho đúng</strong>\\n<ul>\\n  <li>Mỗi trial một file SQLite mới: trial sau không được hưởng idempotency của trial trước. Giá token là mô phỏng, không ghi là hóa đơn API; latency của MockLLM là <code>unavailable</code>.</li>\\n  <li>Pass^5 khắt khe hơn pass rate: một claim fail ở một seed là mất cả claim. Swarm 69/70 trial đúng nhưng chỉ 13/14 claim đúng cả 5 seed.</li>\\n  <li>Một workflow đúng trên hidden ra 1.0 / 1.0; swarm 0.97 / 0.85, chỉ fail ở seed 55 (README, phần giảng viên).</li>\\n  <li>Sau 16:15: chạy benchmark trên <code>student_drop/hidden_claims.jsonl</code> để tự kiểm không lỗi, trace đúng contract, không <code>leak_suspect</code>. Không có nhãn nên không ra pass rate.</li>\\n</ul>","activeCp":"5","timerMin":45,"timerLabel":"M4: Benchmark, nộp","completedThrough":null},{"index":14,"title":"Chọn shape: decision ADR","html":"<h2 class=\\"title\\">Chọn shape: pass nhỉnh hơn có đáng cost và variance không?</h2>\\n<div class=\\"grid grid-2\\">\\n<pre class=\\"code code--wrap\\">- Shape chọn: workflow\\n- Commit hash:\\n- Run id dẫn chứng:\\n- Pass rate / pass^5 / seed min-max / variance:\\n- Cost per success (mô phỏng, VND):\\n- Crash safety: 20/20 (reports/crash.json)\\n- Secret leak / approval bypass:</pre>\\n  <div class=\\"stack\\">\\n    <section class=\\"panel\\">\\n      <h3>Ba câu ADR phải trả lời</h3>\\n      <ol class=\\"plain\\">\\n        <li>Vì sao shape này, so cùng corpus và cùng seed.</li>\\n        <li>Pass nhỉnh hơn mà cost, variance cao hơn thì giữ hay đổi?</li>\\n        <li>Điều kiện nào làm quyết định đảo lại?</li>\\n      </ol>\\n    </section>\\n    <p class=\\"note\\">Điền sau dấu <code>:</code> trên cùng dòng, không xóa nhãn. <code>check_submission</code> đọc bằng máy.</p>\\n  </div>\\n</div>","notes":"<strong>Gợi ý thảo luận</strong>\\n<ul>\\n  <li>Task claims chủ yếu tuần tự, luật rõ, tiền do code tính: shape ít tự chủ thường đủ. Nhưng phải chứng minh bằng số của nhóm, không bằng niềm tin.</li>\\n  <li>Điều kiện có thể đảo quyết định: ticket mơ hồ cần hỏi lại khách, nhiều nguồn cần đọc song song, hoặc model thật thay MockLLM.</li>\\n  <li>Phần giới hạn phải ghi: MockLLM không phải model sản xuất; latency <code>unavailable</code>; không sửa JSON cho đủ 0.75.</li>\\n  <li>Research card (<code>docs/research_card.md</code>): chọn một câu R1 đến R4, biến thành một ablation chỉ đổi một biến.</li>\\n</ul>","activeCp":"5","timerMin":null,"timerLabel":null,"completedThrough":null},{"index":15,"title":"17:00: nộp bài","html":"<h2 class=\\"title\\">17:00: thứ tự nộp, <code>check_submission</code> phải ra 0 FAIL</h2>\\n<div class=\\"grid grid-2\\">\\n  <ol class=\\"loop loop--three\\" style=\\"grid-template-columns: 1fr\\">\\n    <li><b><code>python -m pytest -q</code> xanh</b><span>Cổng host vẫn giữ.</span></li>\\n    <li><b>Chạy benchmark và crash test</b><span>Tạo <code>reports/benchmark.json</code>, <code>reports/crash.json</code>. Không sửa tay.</span></li>\\n    <li><b>Commit, ghi hash và run id vào ADR, commit tiếp</b><span><code>git rev-parse --short HEAD</code>.</span></li>\\n  </ol>\\n  <div class=\\"stack\\">\\n<pre class=\\"code\\">python -m lab8.check_submission\\n<span class=\\"c\\"># phải ra 0 FAIL, rồi push</span></pre>\\n    <table class=\\"data data--compact\\">\\n      <tbody>\\n        <tr><td>3 shape</td><td>RunResult hợp lệ, trace đúng, không <code>not_implemented</code></td></tr>\\n        <tr><td>benchmark.json</td><td>Đủ 4 shape, seed 11 đến 55, ≥ 10 claim</td></tr>\\n        <tr><td>crash.json</td><td><code>crash_safety</code> = 20/20</td></tr>\\n        <tr><td>docs</td><td>ADR, contributions, research card đã điền</td></tr>\\n      </tbody>\\n    </table>\\n  </div>\\n</div>","notes":"<strong>Theo checklist nộp bài trong README</strong>\\n<ul>\\n  <li><code>check_submission</code> không chấm điểm, chỉ kiểm grader có đọc được bài hay không.</li>\\n  <li><code>docs/contributions.md</code>: mỗi thành viên một dòng. <code>docs/research_card.md</code>: cột “Nhóm điền” không trống. <code>docs/bonus_report.md</code> chỉ khi làm bonus, tiêu đề <code># Bonus report: B1</code> đến <code>B6</code>.</li>\\n  <li>Giảng viên chạy lại đúng các lệnh đó, nên sửa tay JSON trong <code>reports/</code> sẽ lộ.</li>\\n</ul>","activeCp":"5","timerMin":null,"timerLabel":null,"completedThrough":null},{"index":16,"title":"Rubric 100 điểm và bonus","html":"<h2 class=\\"title\\">Rubric 100 điểm, bonus tối đa +10 cho cả nhóm</h2>\\n<div class=\\"grid grid-rubric\\">\\n  <table class=\\"data data--compact\\">\\n    <thead><tr><th>Hạng mục</th><th>Điểm</th></tr></thead>\\n    <tbody>\\n      <tr><td><b>Implementation</b></td><td class=\\"bar-cell\\" title=\\"20 điểm\\"><span class=\\"bar\\" style=\\"--v: 1.000\\"></span><span class=\\"bar-val\\">20</span></td></tr>\\n      <tr><td><b>Durability</b></td><td class=\\"bar-cell\\" title=\\"20 điểm\\"><span class=\\"bar\\" style=\\"--v: 1.000\\"></span><span class=\\"bar-val\\">20</span></td></tr>\\n      <tr><td><b>Hidden</b></td><td class=\\"bar-cell\\" title=\\"15 điểm\\"><span class=\\"bar\\" style=\\"--v: 0.750\\"></span><span class=\\"bar-val\\">15</span></td></tr>\\n      <tr><td><b>Policy</b></td><td class=\\"bar-cell\\" title=\\"10 điểm\\"><span class=\\"bar\\" style=\\"--v: 0.500\\"></span><span class=\\"bar-val\\">10</span></td></tr>\\n      <tr><td><b>Handoff</b></td><td class=\\"bar-cell\\" title=\\"10 điểm\\"><span class=\\"bar\\" style=\\"--v: 0.500\\"></span><span class=\\"bar-val\\">10</span></td></tr>\\n      <tr><td><b>Benchmark</b></td><td class=\\"bar-cell\\" title=\\"10 điểm\\"><span class=\\"bar\\" style=\\"--v: 0.500\\"></span><span class=\\"bar-val\\">10</span></td></tr>\\n      <tr><td><b>Reproducibility</b></td><td class=\\"bar-cell\\" title=\\"10 điểm\\"><span class=\\"bar\\" style=\\"--v: 0.500\\"></span><span class=\\"bar-val\\">10</span></td></tr>\\n      <tr><td><b>Đóng góp</b></td><td class=\\"bar-cell\\" title=\\"5 điểm\\"><span class=\\"bar\\" style=\\"--v: 0.250\\"></span><span class=\\"bar-val\\">5</span></td></tr>\\n    </tbody>\\n  </table>\\n  <div class=\\"stack\\">\\n    <section class=\\"panel\\">\\n      <h3>Sáu topic bonus, chọn một</h3>\\n      <p>B1 investigator song song · B2 nhãn lỗi MAST · B3 verifier chống khuếch đại lỗi · B4 baseline công bằng, ablation · B5 provider idempotency · B6 investigator từ xa kiểu A2A.</p>\\n    </section>\\n    <section class=\\"anti\\">\\n      <h3><svg xmlns=\\"http://www.w3.org/2000/svg\\" width=\\"20\\" height=\\"20\\" viewBox=\\"0 0 24 24\\" fill=\\"none\\" stroke=\\"currentColor\\" stroke-width=\\"2\\" stroke-linecap=\\"round\\" stroke-linejoin=\\"round\\" class=\\"lucide lucide-triangle-exclamation-point lucide-alert-triangle lucide-triangle-alert box-icon\\" aria-hidden=\\"true\\"><path d=\\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3\\"></path><path d=\\"M12 9v4\\"></path><path d=\\"M12 17h.01\\"></path></svg>Bonus chỉ tính khi</h3>\\n      <ul>\\n        <li>Shape chọn qua cả 3 must-pass.</li>\\n        <li>Pass rate hidden <b>≥ 0.80</b>, cao hơn ngưỡng 0.75.</li>\\n      </ul>\\n    </section>\\n  </div>\\n</div>","notes":"<strong>Nguồn</strong>\\n<ul>\\n  <li>Rubric lấy từ README; tiêu chí chi tiết nằm trong lab guide. Durability và Implementation nặng nhất, mỗi mục 20.</li>\\n  <li>Chi tiết bonus, thang điểm và cách chấm: <code>docs/bonus_topics.md</code>. Biến thể bonus chạy cạnh 4 shape, chấm trên hidden bằng cờ <code>--extra-shape</code>.</li>\\n  <li>Nguồn các topic: Google Research 2026 (scaling, error amplification), MAST NeurIPS 2025, EMNLP 2026 và AgentArch AACL 2026, DBOS durable workflows, A2A v1.0 và ProtocolBench ICML 2026.</li>\\n</ul>","activeCp":null,"timerMin":null,"timerLabel":null,"completedThrough":5},{"index":17,"title":"Sự cố hay gặp","html":"<h2 class=\\"title\\">Sự cố hay gặp</h2>\\n<div class=\\"grid grid-3\\">\\n  <section class=\\"panel\\"><h3><code>No module named 'lab8'</code></h3><p>Chưa đứng ở gốc repo, hoặc chưa activate venv, chưa cài requirements.</p></section>\\n  <section class=\\"panel\\"><h3>T12 <code>crash did not fire</code></h3><p>Chưa truyền <code>crash_at</code> vào <code>issue_refund</code>, hoặc đã bắt <code>InjectedCrash</code>.</p></section>\\n  <section class=\\"panel\\"><h3><code>missing_trace</code>, <code>stale_trace</code></h3><p>Thiếu trace ở nhánh return sớm (<code>needs_info</code>, <code>escalated</code>).</p></section>\\n  <section class=\\"panel\\"><h3>Windows <code>PermissionError</code> với <code>.sqlite</code></h3><p>Connection chưa đóng. Đóng trong <code>finally: conn.close()</code>.</p></section>\\n  <section class=\\"panel\\"><h3>Chạy lần hai không tạo refund mới</h3><p>Ledger đang làm đúng. Muốn chạy lại từ đầu: xóa file hoặc đổi <code>--db</code>.</p></section>\\n  <section class=\\"panel\\"><h3>Muốn gọi model thật</h3><p>Không được. MockLLM cố định theo seed để mọi nhóm so cùng điều kiện.</p></section>\\n</div>","notes":"<strong>Bảng lấy từ mục Xử lý sự cố trong README</strong>\\n<ul>\\n  <li>Benchmark của shape stub ra pass rate 0 là đúng: shape đó chưa được triển khai.</li>\\n  <li>Benchmark báo <code>exception:...</code> cho một shape: xem <code>reason</code> trong <code>reports/benchmark.json</code>; các shape khác vẫn được chấm.</li>\\n  <li>Windows <code>UnicodeEncodeError</code>: <code>$env:PYTHONUTF8=1</code> (PowerShell) hoặc <code>set PYTHONUTF8=1</code> (cmd).</li>\\n</ul>","activeCp":null,"timerMin":null,"timerLabel":null,"completedThrough":5},{"index":18,"title":"Checklist và khởi động lab","html":"<h2 class=\\"title\\">Checklist cuối buổi và khởi động lab</h2>\\n<div class=\\"grid grid-rubric\\">\\n  <ul class=\\"checklist\\">\\n    <li>Ba shape qua 62 test student mỗi shape, cổng <code>pytest -q</code> xanh</li>\\n    <li>Trace đúng contract v1 ở mọi nhánh, không secret, không PII</li>\\n    <li><code>reports/crash.json</code>: 20/20</li>\\n    <li><code>reports/benchmark.json</code>: 4 shape × 5 seed, ≥ 10 claim</li>\\n    <li>ADR có shape chọn, hash, run id, số đo; contributions, research card đã điền</li>\\n    <li><code>python -m lab8.check_submission</code> ra 0 FAIL, rồi push</li>\\n  </ul>\\n  <div class=\\"stack\\">\\n    <section class=\\"panel\\">\\n      <h3>Deadline</h3>\\n      <p class=\\"deadline\\">{{DEADLINE}}</p>\\n    </section>\\n    <div class=\\"cta-row\\">\\n      <button class=\\"btn-primary\\" type=\\"button\\" onclick=\\"window.kickoffLab && window.kickoffLab()\\">Bắt đầu M0: cài đặt, chia vai</button>\\n    </div>\\n  </div>\\n</div>","notes":"<strong>Lời dặn</strong>\\n<ul>\\n  <li>Bấm nút để về M0 và bắt đầu đếm giờ.</li>\\n  <li>Sửa chữ deadline ở hằng số <code>DEADLINE</code> trong <code>app/src/session.ts</code> nếu lớp có hạn cụ thể.</li>\\n</ul>","activeCp":null,"timerMin":null,"timerLabel":null,"completedThro
